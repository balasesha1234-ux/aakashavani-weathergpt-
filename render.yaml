services:
  - type: web
    name: aakashavani-platform
    env: python
    region: singapore # Closest to India for sub-50ms latency
    plan: free
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NODE_VERSION
        value: 20.11.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aakashavani-db
          property: connectionString
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

databases:
  - name: aakashavani-db
    databaseName: aakashavani
    user: aakashavani_admin
    region: singapore
    plan: free
