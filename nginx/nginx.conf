# ==============================================================================
# 🌐 AakashaVani (WeatherGPT) — Production Layer-7 Load Balancer Configuration
# Architecture: Least-Connections Load Balancing across Horizontally Scaled Nodes
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # High-Performance Logging with Request Duration & Upstream Node Attribution
    log_format upstream_timed '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'rt=$request_time uct="$upstream_connect_time" '
                             'uht="$upstream_header_time" urt="$upstream_response_time" '
                             'node="$upstream_addr"';

    access_log /var/log/nginx/access.log upstream_timed;
    error_log  /var/log/nginx/error.log warn;

    # Performance Optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens   off;

    # Gzip Compression for Fast Rural 2G/3G PWA Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/rss+xml application/atom+xml image/svg+xml;

    # Denial of Service (DoS) & API Burst Rate-Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_burst_limit:10m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=chat_llm_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    # ==============================================================================
    # 🔀 UPSTREAM BACKEND CLUSTER (Horizontal Node Distribution)
    # Algorithm: least_conn (routes traffic to the node with fewest active requests)
    # ==============================================================================
    upstream aakashavani_cluster {
        least_conn;

        # Horizontal Nodes (Containers or process ports)
        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s weight=1;
        server 127.0.0.1:8002 max_fails=3 fail_timeout=10s weight=1;
        server 127.0.0.1:8003 max_fails=3 fail_timeout=10s weight=1;
        
        # Standby Disaster Recovery Failover Node
        server 127.0.0.1:8004 backup;

        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name aakashavani.in *.aakashavani.in localhost;

        # Maximum file upload size (satellite imagery & crop disease photos)
        client_max_body_size 12M;

        # Global Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self), geolocation=(self)" always;

        # Health Probe for Cloud Load Balancers (AWS ALB / GCP Cloud Load Balancing)
        location /lb-health {
            access_log off;
            return 200 "ALB_HEALTH_PROBE_OK\n";
        }

        # 1. Critical AI Chat Routing (Rate Limited for LLM Token Protection)
        location /api/chat {
            limit_req zone=chat_llm_limit burst=15 nodelay;
            limit_conn addr_conn_limit 10;

            proxy_pass http://aakashavani_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 2. Telecom & High-Throughput Weather Ingestion Gateways
        location /api/ {
            limit_req zone=api_burst_limit burst=30 nodelay;
            limit_conn addr_conn_limit 20;

            proxy_pass http://aakashavani_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Upstream Failover & Retries
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # 3. Static Assets Caching (Leaflet radar tiles, CSS, JS chunks)
        location /assets/ {
            alias /var/www/aakashavani/frontend/dist/assets/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # 4. Frontend Single Page App Delivery & Custom Error Fallbacks
        location / {
            root /var/www/aakashavani/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 5. Branded Error Pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /var/www/aakashavani/templates;
            internal;
        }
    }
}
